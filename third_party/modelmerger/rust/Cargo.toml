[workspace]
members = ["crates/cast-codec", "crates/model-merger-engine", "crates/alchemy-model-merger"]
resolver = "3"

[workspace.package]
version = "2.2.2"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
cast-codec = { path = "crates/cast-codec" }
model-merger-engine = { path = "crates/model-merger-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
